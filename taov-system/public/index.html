<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>תאוב | עוזר עסקי</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>תאוב</h1><span>סביבת עבודה • נתונים סינתטיים בלבד</span><button id="logout" hidden>יציאה</button></header><main><p id="notice" role="status"></p><section id="login"><h2>כניסת מנהל</h2><form id="loginForm"><label>שם משתמש<input name="username" value="admin" autocomplete="username" required></label><label>סיסמה<input name="password" type="password" autocomplete="current-password" required></label><button>כניסה מאובטחת</button></form></section><section id="workspace" hidden><nav id="nav"></nav><h2 id="title"></h2><div id="tools"></div><form id="editor"><input name="id" type="hidden"><label>שם<input name="name" required maxlength="200"></label><label>סטטוס<select name="status"><option>חדש</option><option>בטיפול</option><option>ממתין</option><option>הושלם</option></select></label><label>אחראי<input name="owner"></label><label>מועד יעד<input name="due" type="date"></label><label>כישורים / צרכים<input name="skills" placeholder="למשל: סיעוד, עברית"></label><label>הערות<textarea name="notes"></textarea></label><button>שמירה</button><button type="button" id="reset">ניקוי</button></form><div class="tableWrap"><table><thead><tr><th>שם</th><th>סטטוס</th><th>אחראי</th><th>מועד יעד</th><th>פעולות</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/app.js"></script></body></html>
